<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; width:1200px; height:630px; overflow:hidden; }
  body { position:relative; color:#f4f4f5; font-family:Inter, sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    background: radial-gradient(90% 100% at 85% 0%, rgba(250,78,2,.42), transparent 60%), radial-gradient(70% 90% at 0% 100%, rgba(232,213,163,.13), transparent 60%), linear-gradient(180deg,#121216,#0a0a0c); }
  body::before { content:""; position:absolute; inset:0; opacity:.06; background:repeating-linear-gradient(115deg,#fff 0 2px,transparent 2px 26px); }
  .tag { position:relative; display:inline-flex; align-items:center; gap:12px; padding:9px 20px; border-radius:999px; border:2px solid rgba(232,213,163,.5); color:#e8d5a3; font:800 22px Archivo; letter-spacing:.2em; }
  .tag i { width:11px; height:11px; border-radius:50%; background:#ff3b3b; box-shadow:0 0 0 6px rgba(255,59,59,.22); }
  /* level lockup: letters of both wordmarks are --c tall and share one baseline */
  .lock { --c:50px; position:relative; margin:46px 0 44px; line-height:1; white-space:nowrap; }
  .tip img:first-child { height:calc(var(--c)*1.872); vertical-align:calc(var(--c)*-0.195); margin-right:calc(var(--c)*.3); }
  .tip img:last-child { height:calc(var(--c)*1.482); vertical-align:calc(var(--c)*-0.035); }
  .x { display:inline-block; margin:0 calc(var(--c)*.55); color:#fa4e02; font:300 calc(var(--c)*1.5)/1 Inter; vertical-align:calc(var(--c)*.12); }
  .ix { height:calc(var(--c)*1.44); vertical-align:calc(var(--c)*-0.176); }
  .line { position:relative; font:900 50px/1 Archivo; font-stretch:70%; text-transform:uppercase; }
  .line em { font-style:normal; color:#fa4e02; }
  .url { position:relative; margin-top:22px; color:#a1a1aa; font:700 22px Inter; letter-spacing:.04em; }
</style></head>
<body>
  <span class="tag"><i></i>OFFICIAL · NOV 2026</span>
  <div class="lock">
    <span class="tip"><img src="../assets/brand/tipoff-pin.png"><img src="../assets/brand/tipoff-wordmark.png"></span>
    <span class="x">×</span>
    <img class="ix" src="../assets/ix/ix-podcast-logo.png">
  </div>
  <div class="line">Your front row seat to <em>women's basketball</em></div>
  <div class="url">thetipoffguide.com</div>
</body></html>
