# Refreshes the Unrivaled headlines in js/news-data.js every morning, the job the Mac used to run.
# When the file changes it commits it, and Cloudflare Pages republishes the site automatically.
name: Update headlines

on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC: 7 AM Eastern / 6 AM Central in winter
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch headlines
        run: python3 scripts/update_news.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- js/news-data.js; then
            echo "Headlines unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add js/news-data.js
            git commit -m "Update headlines"
            git push
          fi
