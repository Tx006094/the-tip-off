  <style>
    :root { --bg: #0b0b0d; --surface: #16161a; --surface-2: #1d1d22; --line: #2a2a30; --text: #f5f5f7; --muted: #b8b8c0; --dim: #8b8b95; --wnba: #ff6a13; --edge: 20px; }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.6 Inter, system-ui, sans-serif; }
    a { color: inherit; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 var(--edge) 64px; }
    .top { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--line); margin-bottom: 32px; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .brand .pin { height: 46px; width: auto; }
    .brand .word { height: 38px; width: auto; }
    .back { color: var(--muted); text-decoration: none; font-weight: 600; font-size: 15px; padding: 10px 0; }
    .back:hover { color: var(--text); }
    .eyebrow { color: var(--wnba); font-weight: 700; font-size: 14px; letter-spacing: .02em; text-align: center; }
    h1 { font: 900 clamp(34px, 7vw, 60px)/0.98 Archivo, sans-serif; font-stretch: 80%; text-transform: uppercase; margin: 8px 0 12px; letter-spacing: -0.01em; text-align: center; }
    .dek { color: var(--muted); font-size: 18px; max-width: 60ch; margin: 0 auto 22px; text-align: center; }
    .subscribe { display: flex; justify-content: center; margin-bottom: 26px; }
    .yt-btn { display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 18px; border-radius: 12px; background: #fff; color: #0b0b0d; text-decoration: none; font-weight: 700; }
    .yt-btn:hover { background: var(--wnba); color: #1a0a00; }
    .yt-btn svg { width: 22px; height: 22px; }
    /* Click-to-play: show the thumbnail, load YouTube's player only when someone presses play */
    .ep-player { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: #000 center / cover no-repeat; cursor: pointer; padding: 0; }
    .ep-player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .ep-play { position: absolute; left: 50%; top: 50%; width: 72px; height: 72px; margin: -36px 0 0 -36px; border-radius: 50%; background: rgba(255, 106, 19, .95); display: grid; place-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.5); transition: transform .2s; } /* taste-skill-ignore: play button */
    .ep-player:hover .ep-play { transform: scale(1.08); }
    .ep-play svg { width: 28px; height: 28px; fill: #1a0a00; margin-left: 4px; }
    .latest-title { font: 800 clamp(20px, 3vw, 26px)/1.2 Archivo, sans-serif; font-stretch: 85%; margin: 14px 0 34px; text-align: center; }
    h2 { font: 800 24px/1.1 Archivo, sans-serif; font-stretch: 85%; text-transform: uppercase; margin: 0 0 14px; }
    .grid { list-style: none; margin: 0 0 36px; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .grid .ep-player { border-radius: 12px; }
    .grid .ep-play { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
    .grid .ep-play svg { width: 20px; height: 20px; }
    .grid p { margin: 8px 0 0; font-size: 15px; font-weight: 600; line-height: 1.35; }
    .cta-wrap { text-align: center; padding-top: 24px; border-top: 1px solid var(--line); }
    .cta { display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 26px; border-radius: 14px; background: #fff; color: #0b0b0d; text-decoration: none; font: 800 17px/1 Inter, sans-serif; }
    .cta:hover { background: var(--wnba); color: #1a0a00; }
    .empty { color: var(--muted); text-align: center; }
    @media (max-width: 760px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } .grid p { font-size: 14px; } }
    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr; }
      .dek { font-size: 16px; }
      .cta, .yt-btn { width: 100%; justify-content: center; }
      .brand .pin { height: 40px; } .brand .word { height: 32px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="/" aria-label="The Tip-Off, home"><img class="pin" src="assets/brand/tipoff-pin.png" width="153" height="192" alt="" /><img class="word" src="assets/brand/tipoff-wordmark.png" width="400" height="126" alt="The Tip-Off" /></a>
      <a class="back" href="/">← All games</a>
    </header>

    <main>
      <div class="eyebrow">Podcast</div>
      <h1>The IX Podcast</h1>
      <p class="dek">WNBA and women's basketball talk: the news, the trades, the rookies and the stories behind the game.</p>
      <div class="subscribe">
        <a class="yt-btn" href="https://www.youtube.com/@theixpodcast?sub_confirmation=1" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ff0000" d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12 31 31 0 0 0 1 16.8a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8z"/><path fill="#fff" d="M9.8 15.1 15.6 12 9.8 8.9z"/></svg>
          Subscribe on YouTube
        </a>
      </div>

      <div id="latest"></div>
      <section id="more" hidden>
        <h2>More episodes</h2>
        <ul class="grid" id="episodes"></ul>
      </section>

      <div class="cta-wrap">
        <a class="cta" href="/">Go to today's games →</a>
      </div>
    </main>
  </div>

  <script src="js/podcast-data.js"></script>
  <script>
    (function () {
      var eps = (typeof SITE_PODCAST !== "undefined" && SITE_PODCAST.episodes) || [];
      var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
      var thumb = function (id, big) { return "https://i.ytimg.com/vi/" + id + "/" + (big ? "maxresdefault" : "hqdefault") + ".jpg"; };
      var player = function (e, big) {
        return '<button type="button" class="ep-player" data-yt="' + esc(e.id) + '" aria-label="Play: ' + esc(e.title) + '" style="background-image:url(' + thumb(e.id, big) + ')">' +
          '<span class="ep-play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 4l15 8-15 8z"/></svg></span></button>';
      };
      if (!eps.length) { document.getElementById("latest").innerHTML = '<p class="empty">New episodes are on the way. Watch them on YouTube in the meantime.</p>'; return; }
      document.getElementById("latest").innerHTML = player(eps[0], true) + '<p class="latest-title">' + esc(eps[0].title) + "</p>";
      if (eps.length > 1) {
        document.getElementById("more").hidden = false;
        document.getElementById("episodes").innerHTML = eps.slice(1).map(function (e) { return "<li>" + player(e, false) + "<p>" + esc(e.title) + "</p></li>"; }).join("");
      }
      // Big thumbnails don't exist for every video: fall back to the standard one.
      var big = document.querySelector("#latest .ep-player");
      var probe = new Image();
      probe.onload = function () { if (probe.naturalWidth < 200) big.style.backgroundImage = "url(" + thumb(eps[0].id, false) + ")"; };
      probe.onerror = function () { big.style.backgroundImage = "url(" + thumb(eps[0].id, false) + ")"; };
      probe.src = thumb(eps[0].id, true);
      document.addEventListener("click", function (ev) {
        var b = ev.target.closest("[data-yt]");
        if (!b || b.querySelector("iframe")) return;
        b.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + b.dataset.yt + '?autoplay=1&rel=0" title="' + esc(b.getAttribute("aria-label")) + '" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
      });
    })();
  </script>
</body>
</html>
