<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Watch TheIXPodcast | The Tip-Off</title>
  <meta name="description" content="Watch TheIXPodcast on The Tip-Off: WNBA and NCAA women's basketball talk, news and breakdowns, plus where to watch tonight's games." />
  <link rel="canonical" href="https://thetipoffguide.com/watch" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="The Tip-Off" />
  <meta property="og:title" content="Watch TheIXPodcast on The Tip-Off" />
  <meta property="og:description" content="WNBA and NCAA women's basketball talk from TheIXPodcast, now part of The Tip-Off." />
  <meta property="og:url" content="https://thetipoffguide.com/watch" />
  <meta property="og:image" content="https://thetipoffguide.com/assets/ix/ix-share-card.jpg?v=3" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="The Tip-Off × TheIXPodcast. Your front row seat to women's basketball." />
  <meta name="twitter:image" content="https://thetipoffguide.com/assets/ix/ix-share-card.jpg?v=3" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/brand/favicon-192.png?v=1" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/brand/apple-touch-icon.png?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Inter:wght@400;500;600;700&display=swap" />
  <style>
    :root { --bg:#0a0a0c; --surface:#17171c; --surface-2:#202027; --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.16);
      --text:#f4f4f5; --muted:#a1a1aa; --accent:#fa4e02; --font-display:"Archivo","Helvetica Neue",Arial,sans-serif; --font-body:"Inter",system-ui,sans-serif; --gutter:clamp(16px,4vw,48px); }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); -webkit-font-smoothing:antialiased; }
    .wrap { max-width:1200px; margin:0 auto; padding:0 var(--gutter); }
    .top { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 0; border-bottom:1px solid var(--line); }
    .top a.home { display:flex; align-items:center; gap:8px; }
    .top a.home img:first-child { height:34px; width:auto; } .top a.home img:last-child { height:26px; width:auto; }
    .top .back { color:var(--muted); text-decoration:none; font-weight:600; font-size:14px; }
    .hero { text-align:center; padding:clamp(28px,5vw,52px) 0 22px; }
    .hero img { width:min(520px,90%); height:auto; border-radius:8px; }
    .hero p { color:var(--muted); margin:14px 0 0; }
    .hero .sub { display:inline-block; margin-top:14px; color:var(--accent); font-weight:700; text-decoration:none; }
    .player-grid { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:20px; align-items:start; padding-bottom:56px; }
    .main { scroll-margin-top:16px; }
    .frame { position:relative; aspect-ratio:16/9; border-radius:16px; overflow:hidden; background:#000; border:1px solid var(--line-strong); }
    .frame iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
    .cover { position:absolute; inset:0; width:100%; height:100%; padding:0; border:0; background:#000; cursor:pointer; }
    .cover img { width:100%; height:100%; object-fit:cover; display:block; }
    .bigplay { position:absolute; left:50%; top:50%; width:76px; height:76px; margin:-38px 0 0 -38px; border-radius:50%; background:var(--accent); display:grid; place-items:center; box-shadow:0 8px 30px rgba(0,0,0,.5); transition:transform .15s; }
    .bigplay svg { width:30px; height:30px; fill:#fff; margin-left:4px; }
    .cover:hover .bigplay { transform:scale(1.08); }
    .cover:focus-visible { outline:3px solid var(--accent); outline-offset:-3px; }
    .now small { display:block; margin-top:14px; color:var(--accent); font-weight:700; font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
    .now h1 { margin:4px 0 0; font:800 clamp(20px,2.4vw,26px)/1.2 var(--font-display); font-stretch:85%; }
    .list { list-style:none; margin:0; padding:0; display:grid; gap:10px; max-height:calc(100vh - 40px); overflow:auto; position:sticky; top:16px; }
    .tile { width:100%; display:grid; grid-template-columns:140px minmax(0,1fr); gap:12px; align-items:center; padding:8px; border-radius:14px;
      border:1px solid var(--line); background:var(--surface); color:inherit; font:inherit; text-align:left; cursor:pointer; }
    .tile:hover { background:var(--surface-2); }
    .tile:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .tile .th { position:relative; aspect-ratio:16/9; border-radius:9px; overflow:hidden; background:#000; }
    .tile img { width:100%; height:100%; object-fit:cover; display:block; }
    .tile b { display:block; font-size:14px; line-height:1.3; }
    .tile[aria-current="true"] { border-color:var(--accent); background:rgba(250,78,2,.1); }
    .tile[aria-current="true"] .th::after { content:"NOW PLAYING"; position:absolute; left:5px; top:5px; background:var(--accent); color:#fff; font:800 10px var(--font-display); letter-spacing:.08em; padding:3px 6px; border-radius:4px; }
    .cta { display:block; width:max-content; margin:0 auto 60px; padding:13px 24px; border-radius:999px; background:var(--accent); color:#fff; font-weight:700; text-decoration:none; }
    @media (max-width:860px) {
      .player-grid { grid-template-columns:1fr; }
      .list { position:static; max-height:none; grid-template-columns:repeat(2,minmax(0,1fr)); }
      .tile { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="home" href="/" aria-label="The Tip-Off, home"><img src="/assets/brand/tipoff-pin.png" width="153" height="192" alt="" /><img src="/assets/brand/tipoff-wordmark.png" width="400" height="126" alt="The Tip-Off" /></a>
      <a class="back" href="/">← Tonight's games</a>
    </div>
    <div class="hero">
      <img src="/assets/ix/ix-podcast-logo.png" width="1000" height="131" alt="TheIXPodcast" />
      <p>WNBA and NCAA women's basketball talk, now on The Tip-Off.</p>
      <a class="sub" href="https://www.youtube.com/@theixpodcast?sub_confirmation=1" target="_blank" rel="noopener">Subscribe on YouTube →</a>
    </div>
    <div class="player-grid">
      <div class="main" id="mainPlayer">
        <div class="frame" id="frame"></div>
        <div class="now"><small>Now playing</small><h1 id="nowTitle"></h1></div>
      </div>
      <ul class="list" id="list" aria-label="More episodes"></ul>
    </div>
    <a class="cta" href="/#schedule">Find Tonight's Games</a>
  </div>
  <script>
    // Episodes from youtube.com/@theixpodcast, newest first. Add new ones at the top.
    const VIDEOS = [
      { id: "632C7B0draU", title: "Are Injuries About to Go Through the Roof?" },
      { id: "u__z4SkFiD8", title: "Team USA - FIBA Women's Basketball 2026 Roster" },
      { id: "dnUDNqXJYzk", title: "WNBA Trade Deadline" },
      { id: "e4oJ_sqiLnk", title: "WNBA All-Star Voting Explained" },
      { id: "wQJLfIz9E5k", title: "The Chennedy Carter Problem: A WNBA Timeline" },
      { id: "t1s8Y9eJ-nY", title: "The 2026 WNBA Rookie Class Is Different: Ranking the Top 5 Right Now" },
      { id: "fTehfl1ECwM", title: "Is Napheesa Collier Back...?" },
      { id: "XqmkRhrgkOo", title: "The WNBA Just Turned Back the Clock" },
      { id: "dTxfHdeX9dc", title: "Did A'ja Wilson Hijack the MVP Race?" },
    ];
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
    // Picking an episode shows its cover art with a play button; the video loads only when the viewer presses play.
    function play(i) {
      const v = VIDEOS[i];
      $("#frame").innerHTML = `<button type="button" class="cover" aria-label="Play ${esc(v.title)}">
          <img src="https://img.youtube.com/vi/${v.id}/maxresdefault.jpg" onerror="this.onerror=null;this.src='https://img.youtube.com/vi/${v.id}/hqdefault.jpg'" alt="${esc(v.title)} cover art">
          <span class="bigplay" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 4l14 8-14 8z"/></svg></span></button>`;
      $("#frame .cover").addEventListener("click", () => {
        $("#frame").innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${v.id}?rel=0&autoplay=1" title="${esc(v.title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
      });
      $("#nowTitle").textContent = v.title;
      document.querySelectorAll(".tile").forEach((t, j) => t.setAttribute("aria-current", j === i ? "true" : "false"));
    }
    $("#list").innerHTML = VIDEOS.map((v, i) => `<li><button type="button" class="tile" data-i="${i}" aria-label="Play ${esc(v.title)}">
        <span class="th"><img src="https://img.youtube.com/vi/${v.id}/mqdefault.jpg" alt="${esc(v.title)} thumbnail" loading="lazy" decoding="async"></span>
        <span><b>${esc(v.title)}</b></span></button></li>`).join("");
    $("#list").addEventListener("click", (e) => {
      const b = e.target.closest(".tile"); if (!b) return;
      play(+b.dataset.i);
      if (innerWidth <= 860) $("#mainPlayer").scrollIntoView({ behavior: "smooth", block: "start" });
    });
    play(0);
  </script>
</body>
</html>
